# Render Blueprint: paid plan required for persistent wallet/state storage.
# Create one bot only; sharing a Telegram polling token between instances is unsafe.
services:
  - type: web
    name: base-bsc-arbitrage-bot
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    disk:
      name: wallet-state
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: APP_BIND_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: '3000'
      - key: PORT
        value: '3000'
      - key: WALLET_FILE
        value: /app/data/wallet.json
      - key: STATE_FILE
        value: /app/data/bot-state.json
      - key: TRADING_MODE
        value: paper
      - key: FUNDING_MODE
        value: flashloan
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: BSC_RPC_URL
        value: https://bsc-dataseed.bnbchain.org
