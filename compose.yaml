services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_PUBLIC_URL: https://${APP_DOMAIN:?Set APP_DOMAIN to your server domain}
      APP_BIND_HOST: 0.0.0.0
      APP_PORT: 3000
      WALLET_FILE: /app/data/wallet.json
      STATE_FILE: /app/data/bot-state.json
    volumes:
      - bot-data:/app/data
    expose:
      - "3000"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot
volumes:
  bot-data:
  caddy-data:
  caddy-config:
